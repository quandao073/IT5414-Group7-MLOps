[build-system]
requires = ["uv_build>=0.9.22,<0.14.0"]
build-backend = "uv_build"

[project]
name = "hotel_booking"
version = "0.0.1"
description = "Hotel booking cancellation prediction - an end-to-end MLOps pipeline (IT5414)."
authors = [
  { name = "IT5414 Group 7", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "lightgbm==4.7.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "typer==0.27.3",
    "uvicorn==0.34.0",
    "xgboost==3.4.1",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==3.0.3",
    "pre-commit==4.1.0",
    "pytest==9.2.0",
    "ruff==0.1.3",
    "mypy==2.4.0",
    "mkdocs-material==9.7.7",
    "mkdocstrings-python==2.0.1",
    "pandas-stubs==3.1.0.261029",
    "types-pyyaml==6.0.12.20261103",
    "dvc==3.67.1",
]

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true
