name: CML train report

# On pull requests that change how the model is trained, train the default model (configs/config.yaml) on the
# pull request and on its base branch, then comment the test metrics of both with CML.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/hotel_booking/config.py"
      - "src/hotel_booking/data.py"
      - "src/hotel_booking/features.py"
      - "src/hotel_booking/model.py"
      - "src/hotel_booking/train.py"
      - "src/hotel_booking/evaluate.py"
      - "src/hotel_booking/sample_model.py"
      - "configs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cml.yaml"
      - ".github/scripts/cml_report.py"
  workflow_dispatch:

concurrency:
  group: cml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  train-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Pull the raw dataset from DagsHub
        env:
          DAGSHUB_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          uv run dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          uv run dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          uv run dvc pull data/raw/hotel_bookings.csv.dvc

      - name: Train on the pull request
        run: |
          uv run invoke preprocess-data
          uv run src/hotel_booking/train.py train.tracking=false train.register=false \
            train.model_version=pr "train.output_dir=$RUNNER_TEMP/pr"

      - name: Train on the base branch
        # Same processed data, so only the code differs. A base without this CLI just yields no comparison.
        continue-on-error: true
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref || 'develop' }}"
          cd "$RUNNER_TEMP/base"
          uv sync --locked --dev
          uv run src/hotel_booking/train.py train.tracking=false train.register=false train.model_version=base \
            "data.processed_dir=$GITHUB_WORKSPACE/data/processed" "train.output_dir=$RUNNER_TEMP/base-model"

      - name: Write the report
        run: |
          uv run python .github/scripts/cml_report.py "$RUNNER_TEMP/pr/model_card.json" \
            "$RUNNER_TEMP/base-model/model_card.json" report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment update report.md
