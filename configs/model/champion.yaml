# Champion selected in IT3190 (notebook 03): soft-voting ensemble of the top 3 models by temporal CV ROC-AUC.
# CV ROC-AUC 0.858, test (01-04/2017) ROC-AUC 0.865; decision threshold 0.456 (best F1 on out-of-fold predictions).
ensemble:
  - name: Random Forest
    encoding: onehot
    half_life_days: 45
    booking_weights: false
    pipeline: {}
    params:
      n_estimators: 300
      min_samples_leaf: 10
      max_features: 0.2
      max_depth: null
      class_weight: null
  - name: XGBoost
    encoding: onehot
    half_life_days: 180
    booking_weights: false
    pipeline: {}
    params:
      subsample: 0.85
      scale_pos_weight: 1.75
      reg_lambda: 1.0
      n_estimators: 400
      min_child_weight: 10
      max_depth: 4
      learning_rate: 0.03
      colsample_bytree: 0.5
  - name: LightGBM
    encoding: onehot
    half_life_days: 90
    booking_weights: false
    pipeline: {}
    params:
      subsample_freq: 1
      subsample: 0.7
      reg_lambda: 1.0
      num_leaves: 15
      n_estimators: 400
      min_child_samples: 100
      learning_rate: 0.02
      colsample_bytree: 1.0
      class_weight: balanced
