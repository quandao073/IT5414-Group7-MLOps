# LightGBM member of the IT3190 champion (notebook 03), used as the default model of `invoke train`.
name: LightGBM
encoding: onehot
half_life_days: 90
booking_weights: false
pipeline: {}
params:
  n_estimators: 400
  learning_rate: 0.02
  num_leaves: 15
  min_child_samples: 100
  subsample: 0.7
  subsample_freq: 1
  colsample_bytree: 1.0
  reg_lambda: 1.0
  class_weight: balanced
